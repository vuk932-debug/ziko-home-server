version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: realistate_redis
    ports:
      - "6379:6379"
    networks:
      - realistate_network

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realistate_server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your_jwt_secret_dev
      - CLOUDINARY_CLOUD_NAME=your_cloud_name
      - CLOUDINARY_API_KEY=your_api_key
      - CLOUDINARY_API_SECRET=your_api_secret
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - redis
    networks:
      - realistate_network

networks:
  realistate_network:
    driver: bridge
